<!-- 11_unit_convertor -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Convertor</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.png" />

    <!-- CSS Styles -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="main-div">
      <div id="hero-section">
        <h1>Metric/Imperial Unit Conversion</h1>
        <span id="input-el" role="textbox" contenteditable></span>
        <button id="convert-btn">Convert</button>
      </div>
      <div id="all-result-div">
        <div class="single-result-div">
          <h3 class="result-header">
            Length <span class="result-unit">(Meter/Feet)</span>
          </h3>
          <span class="result-text" id="length-result"
            >20 meters = 65.616 feet | 20 feet = 6.096 meters</span
          >
        </div>
        <div class="single-result-div">
          <h3 class="result-header">
            Volume <span class="result-unit">(Liters/Gallons)</span>
          </h3>
          <span class="result-text" id="volume-result"
            >20 liters = 5.284 gallons | 20 gallons = 75.708 liters</span
          >
        </div>
        <div class="single-result-div">
          <h3 class="result-header">
            Mass <span class="result-unit">(Kilograms/Pounds)</span>
          </h3>
          <span class="result-text" id="mass-result"
            >20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</span
          >
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
